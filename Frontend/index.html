<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Optimizer — AI &amp; NLP Prompt Engineering</title>
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">Prompt Optimizer</h1>
          <p class="brand-subtitle">Multi-stage NLP and LLM prompt refinement engine</p>
        </div>
      </div>
    </header>

    <!-- Main Card Container -->
    <main class="card main-card">
      <!-- Error Message Box -->
      <div id="errorBox" class="alert-box alert-error" style="display: none;" role="alert">
        <div class="alert-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        </div>
        <div class="alert-body">
          <h4 class="alert-heading">Optimization Failed</h4>
          <p id="errorMessage" class="alert-text"></p>
        </div>
      </div>

      <!-- Prompt Input Form -->
      <form id="optimizerForm" class="optimizer-form" onsubmit="return false;">
        <div class="form-group">
          <label for="promptInput" class="form-label">
            <span>Raw Prompt</span>
            <span class="char-count" id="charCount">0 characters</span>
          </label>
          <textarea
            id="promptInput"
            class="prompt-textarea"
            rows="5"
            placeholder="Type or paste your prompt here... (e.g. 'write a python function for binary search and explain it')"
          ></textarea>
        </div>

        <div class="controls-row">
          <div class="form-group mode-group">
            <label for="modeSelect" class="form-label">Optimization Mode</label>
            <div class="select-wrapper">
              <select id="modeSelect" class="mode-select">
                <option value="hybrid">⚡ Hybrid (Rules + LLM)</option>
                <option value="rules">🛠️ Rules only (Deterministic &amp; Fast)</option>
                <option value="llm">🤖 LLM only (Creative Rewrite)</option>
              </select>
            </div>
          </div>

          <div class="button-group">
            <button id="optimizeBtn" type="button" class="btn btn-primary">
              <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
              </svg>
              <span class="btn-text">Optimize</span>
            </button>
          </div>
        </div>
      </form>

      <!-- Result Section -->
      <section id="result" class="result-section" style="display: none;" aria-live="polite">
        <div class="section-divider">
          <span>Results</span>
        </div>

        <!-- Prompt Comparison: Original vs Optimized -->
        <div class="comparison-container">
          <!-- Original Prompt Card -->
          <div class="prompt-card original-card">
            <div class="prompt-card-header">
              <span class="badge badge-original">Original Prompt</span>
            </div>
            <div class="prompt-card-body">
              <p id="originalText" class="prompt-content"></p>
            </div>
          </div>

          <!-- Optimized Prompt Card -->
          <div class="prompt-card optimized-card">
            <div class="prompt-card-header">
              <span class="badge badge-optimized">✨ Optimized Prompt</span>
              <button id="copyBtn" type="button" class="btn-copy" title="Copy to clipboard">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                <span id="copyBtnText">Copy</span>
              </button>
            </div>
            <div class="prompt-card-body">
              <p id="optimizedText" class="prompt-content"></p>
            </div>
          </div>
        </div>

        <!-- Analytics / Metrics Section -->
        <div class="metrics-grid">
          <div class="metric-card">
            <div class="metric-label">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
                <line x1="7" y1="7" x2="7.01" y2="7"></line>
              </svg>
              Intent Detected
            </div>
            <div id="intentText" class="metric-value">None</div>
          </div>

          <div class="metric-card">
            <div class="metric-label">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="20" x2="18" y2="10"></line>
                <line x1="12" y1="20" x2="12" y2="4"></line>
                <line x1="6" y1="20" x2="6" y2="14"></line>
              </svg>
              Tokens (Original → Optimized)
            </div>
            <div id="tokenText" class="metric-value">0 → 0</div>
          </div>

          <div class="metric-card">
            <div class="metric-label">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              </svg>
              Similarity Score
            </div>
            <div id="scoreText" class="metric-value">0.00</div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- JavaScript Client Logic -->
  <script src="script.js"></script>
  <script src="app.js"></script>
</body>
</html>
